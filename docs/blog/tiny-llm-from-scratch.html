<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8' />
  <meta name='viewport' content='width=device-width, initial-scale=1.0' />
  <title>Build a Tiny LLM in Python</title>
  <style>
    :root { --bg:#f8fafc; --card:#fff; --text:#111827; --muted:#6b7280; --border:#e5e7eb; --code-bg:#0f172a; --code-text:#e5e7eb; --accent:#2563eb; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; line-height:1.7; color:var(--text); background:var(--bg); }
    .page { max-width:980px; margin:0 auto; padding:48px 20px; }
    article { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:48px; box-shadow:0 20px 50px rgba(15,23,42,.08); }
    h1 { font-size:clamp(2.2rem,5vw,4rem); line-height:1.05; margin:0 0 24px; letter-spacing:-.04em; }
    h2 { font-size:1.7rem; line-height:1.2; margin-top:48px; margin-bottom:16px; letter-spacing:-.02em; }
    p, li { font-size:1.05rem; }
    p { margin:0 0 18px; }
    a { color:var(--accent); font-weight:600; text-decoration:none; }
    a:hover { text-decoration:underline; }
    code { font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace; font-size:.95em; background:#eef2ff; color:#3730a3; padding:.15em .35em; border-radius:6px; }
    pre { background:var(--code-bg); color:var(--code-text); padding:20px; border-radius:14px; overflow-x:auto; margin:22px 0; font-size:.88rem; line-height:1.55; }
    pre code { background:transparent; color:inherit; padding:0; }
    blockquote { border-left:4px solid var(--accent); background:#eff6ff; color:#1e3a8a; padding:16px 18px; border-radius:12px; margin:28px 0; }
    hr { border:none; border-top:1px solid var(--border); margin:40px 0; }
    table { width:100%; border-collapse:collapse; margin:24px 0; border:1px solid var(--border); border-radius:12px; overflow:hidden; }
    th,td { text-align:left; padding:14px 16px; border-bottom:1px solid var(--border); }
    tr:last-child td { border-bottom:none; }
    th { background:#f1f5f9; }
    .loading, .error { color:var(--muted); }
    @media (max-width:700px) { article { padding:28px; } .page { padding:24px 12px; } }
  </style>
</head>
<body>
  <main class='page'>
    <article id='content'><p class='loading'>Loading post…</p></article>
  </main>
  <script>
    const localMarkdown = './tiny-llm-from-scratch.md';
    const fallbackMarkdown = 'https://raw.githubusercontent.com/brunotaboada/aicompanion/8fd5d586365d63d909bfbcaf0a7045f9d27ceae7/docs/blog/tiny-llm-from-scratch.md';

    const escapeHtml = (s) => s
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');

    function inlineMarkdown(s) {
      return escapeHtml(s)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    }

    function renderTable(lines, start) {
      const rows = [];
      let i = start;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      const clean = row => row.trim().slice(1, -1).split('|').map(cell => inlineMarkdown(cell.trim()));
      const header = clean(rows[0]);
      const bodyRows = rows.slice(2).map(clean);
      let html = '<table><thead><tr>' + header.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
      html += bodyRows.map(row => '<tr>' + row.map(c => `<td>${c}</td>`).join('') + '</tr>').join('');
      html += '</tbody></table>';
      return [html, i];
    }

    function renderMarkdown(md) {
      const lines = md.split('\n');
      const out = [];
      let inCode = false;
      let listOpen = false;
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.startsWith('```')) {
          if (!inCode) {
            if (listOpen) { out.push('</ul>'); listOpen = false; }
            inCode = true;
            out.push('<pre><code>');
          } else {
            inCode = false;
            out.push('</code></pre>');
          }
          continue;
        }
        if (inCode) { out.push(escapeHtml(line) + '\n'); continue; }
        if (!line.trim()) { if (listOpen) { out.push('</ul>'); listOpen = false; } continue; }
        if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|\s*-/.test(lines[i + 1])) {
          if (listOpen) { out.push('</ul>'); listOpen = false; }
          const [tableHtml, next] = renderTable(lines, i);
          out.push(tableHtml);
          i = next - 1;
          continue;
        }
        if (line === '---') { if (listOpen) { out.push('</ul>'); listOpen = false; } out.push('<hr />'); continue; }
        if (line.startsWith('# ')) { if (listOpen) { out.push('</ul>'); listOpen = false; } out.push(`<h1>${inlineMarkdown(line.slice(2))}</h1>`); continue; }
        if (line.startsWith('## ')) { if (listOpen) { out.push('</ul>'); listOpen = false; } out.push(`<h2>${inlineMarkdown(line.slice(3))}</h2>`); continue; }
        if (line.startsWith('> ')) { if (listOpen) { out.push('</ul>'); listOpen = false; } out.push(`<blockquote>${inlineMarkdown(line.slice(2))}</blockquote>`); continue; }
        if (line.startsWith('- ')) {
          if (!listOpen) { out.push('<ul>'); listOpen = true; }
          out.push(`<li>${inlineMarkdown(line.slice(2))}</li>`);
          continue;
        }
        if (listOpen) { out.push('</ul>'); listOpen = false; }
        out.push(`<p>${inlineMarkdown(line)}</p>`);
      }
      if (listOpen) out.push('</ul>');
      return out.join('\n');
    }

    async function loadPost() {
      const content = document.getElementById('content');
      try {
        let response = await fetch(localMarkdown);
        if (!response.ok) response = await fetch(fallbackMarkdown);
        if (!response.ok) throw new Error('Could not load Markdown post');
        const markdown = await response.text();
        content.innerHTML = renderMarkdown(markdown);
      } catch (err) {
        content.innerHTML = `<p class='error'>Unable to load the Markdown post. Open <code>tiny-llm-from-scratch.md</code> directly.</p>`;
      }
    }

    loadPost();
  </script>
</body>
</html>
